```yaml
name: Build Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            python-version: "3.12"

          - os: macos-14
            platform: macos
            python-version: "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pygame

      - name: Build with PyInstaller
        shell: bash
        run: |
          python -m PyInstaller --clean --noconfirm ShinobiGenerator.spec

      # Windows
      - name: Package Windows
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          7z a "ShinobiGenerator-Windows-x64.zip" "./dist/ShinobiGenerator/*"

      # macOS
      - name: Package macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/ShinobiGenerator.app" \
            "ShinobiGenerator-macOS-arm64.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShinobiGenerator-${{ matrix.platform }}
          path: |
            ShinobiGenerator-Windows-x64.zip
            ShinobiGenerator-macOS-arm64.zip
          if-no-files-found: error

  release:
    name: Upload Release Assets
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ShinobiGenerator-windows
          path: ./release

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ShinobiGenerator-macos
          path: ./release

      - name: Upload files to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./release/ShinobiGenerator-Windows-x64.zip
            ./release/ShinobiGenerator-macOS-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
