```yaml
name: Build Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame pyinstaller

      - name: Build
        run: |
          python -m PyInstaller --clean --noconfirm ShinobiGenerator.spec

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\ShinobiGenerator\*" `
            -DestinationPath "ShinobiGenerator-Windows-x64.zip"

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ShinobiGenerator-Windows-x64.zip


  build-macos:
    name: Build macOS
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame pyinstaller

      - name: Build
        run: |
          python -m PyInstaller --clean --noconfirm ShinobiGenerator.spec

      - name: Create ZIP
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/ShinobiGenerator.app" \
            "ShinobiGenerator-macOS-arm64.zip"

      - name: Upload macOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: ShinobiGenerator-macOS-arm64.zip


  release:
    name: Attach builds to Release
    needs:
      - build-windows
      - build-macos

    runs-on: ubuntu-latest

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: release

      - name: Upload builds to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ShinobiGenerator-Windows-x64.zip
            release/ShinobiGenerator-macOS-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
